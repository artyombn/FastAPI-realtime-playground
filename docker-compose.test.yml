services:
  test_users_app:
    build:
      context: users
      dockerfile: Dockerfile.test
    container_name: test_users_app
    depends_on:
      test_users_db:
        condition: service_healthy
    ports:
      - "7000:7000"
    env_file:
      - .env.test

  test_users_db:
    image: postgres:16
    container_name: test_users_db
    env_file:
      - .env.test
    ports:
      - "5431:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d test_db"]
      interval: 5s
      retries: 5
