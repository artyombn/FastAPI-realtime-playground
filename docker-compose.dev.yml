services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fastapi_app
    command: sh -c "alembic upgrade head && uvicorn src.main:app --host 0.0.0.0 --reload"
    depends_on:
      - postgres
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    networks:
      - dev_network

  postgres:
    image: postgres:latest
    container_name: postgres_db
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data/pgdata
    networks:
      - dev_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    depends_on:
      - postgres
    ports:
      - "8888:80"
    env_file:
      - .env
    volumes:
      - pgadmin:/var/lib/pgadmin
    networks:
      - dev_network

volumes:
  pgdata:
  pgadmin:

networks:
  dev_network:
    driver: bridge
